name: P0-j lockfile generator

permissions:
  contents: write

on:
  push:
    branches:
      - "feat/p0j-mediasoup-sfu"

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0j-mediasoup-sfu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(p0j): refresh npm lockfile for mediasoup"
          git push origin HEAD:feat/p0j-mediasoup-sfu
