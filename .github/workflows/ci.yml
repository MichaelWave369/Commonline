name: CI

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit generated lockfile to P0-d branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/p0d-wire-freeze'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git ls-files package-lock.json)" ]; then
            CONTENT="$(base64 -w0 package-lock.json)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" \
              -f message='chore: add npm lockfile for P0-d wire freeze' \
              -f content="$CONTENT" \
              -f branch="$HEAD_REF"
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
