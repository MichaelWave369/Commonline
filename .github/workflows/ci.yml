name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture generated lockfile for P0-d freeze
        uses: actions/upload-artifact@v4
        with:
          name: commonline-package-lock
          path: package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
