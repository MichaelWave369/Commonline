name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build


  media-acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run P0-q heard-context + explicit reply acceptance
        run: npm run test:media-acceptance
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0q-media-acceptance
          path: |
            test-results
            playwright-report
          if-no-files-found: warn


  p0-experience-proof:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run P0-t end-to-end experience proof
        run: npm run test:p0-experience
      - name: Upload P0-t experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0t-experience-proof
          path: |
            test-results
            playwright-report
          if-no-files-found: warn


  p0-governance-probes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run P0-v governance closure matrix
        run: npm run test:p0-governance
      - name: Upload P0-v governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0v-governance-closure
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
